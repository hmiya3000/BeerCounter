<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="onCancel.emit()">{{ cancelButtonText }}</ion-button>
    </ion-buttons>
        <ion-title>
          <div  style="display: flex; align-items: center; justify-content: center; position: relative;">
            <div 
              (click)="isBackButton ? onHeaderBack() : null"
              [style.opacity]="isBackButton ? 1 : 0"
              [style.pointer-events]="isBackButton ? 'auto' : 'none'"
              style="padding: 12px 16px; margin-left: -12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.15s ease;">
              <ion-icon name="caret-back-outline" style="font-size: 1.6em;"></ion-icon>
            </div>
            @if (isDisplay) {
              <ion-label (click)="onHeaderItemClick()" class="page-flip-animation" style="font-weight: bold; margin: 0 12px; cursor: pointer; text-align: center;">
                {{ headerTitle }}
              </ion-label>
            }
            <div 
              (click)="isForwardButton ? onHeaderForward() : null"
              [style.opacity]="isForwardButton ? 1 : 0"
              [style.pointer-events]="isForwardButton ? 'auto' : 'none'"
              style="padding: 12px 16px; margin-right: -12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.15s ease;">
              <ion-icon name="caret-forward-outline" style="font-size: 1.6em;"></ion-icon>
            </div>
          </div>
        </ion-title>
    @if (showConfirmButton) {
      <ion-buttons slot="end">
        <ion-button (click)="onConfirm.emit()">{{ confirmButtonText }}</ion-button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>

<ion-content
  [scrollY]="isScrollEnabled"
  [forceOverscroll]="isScrollEnabled ? null : false"
  (touchstart)="onTouchStart($event)" 
  (touchend)="onTouchEnd($event)"
  class="scroll-enabled">
  @if (isDisplay) {
    <div class="page-flip-animation" style="width: 100%; height: 100%;">
      <!-- 呼び出し側から渡された中身がここに表示される -->
      <ng-content></ng-content>      
    </div>
  }
</ion-content>
