@if (isInline) {
  <!-- 🌟【Aルート】：画面に直接直貼りする、むき出しのインラインモード -->
  <div class="inline-picker-wrapper">
    <ion-picker>
      <ion-grid class="ion-no-padding">
        <ion-row class="ion-no-padding">
          <ion-col [size]="sizeCol0" class="ion-no-padding">
            <ion-picker-column [value]="selectedValueCol0" (ionChange)="onPickerCol0Change($event)">
              @for (option of optionsCol0; track option.value) {
                <ion-picker-column-option [value]="option.value">{{ option.text }}</ion-picker-column-option>
              }
            </ion-picker-column>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-picker>
  </div>

} @else {

  <!-- 🌟【Bルート】：下からニュッと浮き上がるモーダルモード -->
  <ion-modal
    id="picker-modal"
    cssClass="global-picker-modal"
    [isOpen]="isOpen" 
    [initialBreakpoint]="pickerInitialBreakpoint" 
    [breakpoints]="pickerBreakpoints" 
    [handle]="pickerInitialBreakpoint ? true : false"
    [backdropDismiss]="true"
    (ionModalDidPresent)="onModalDidPresent()"
    (ionModalWillDismiss)="onModalWillDismiss()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start"><ion-button (click)="isOpen = false">キャンセル</ion-button></ion-buttons>
          <ion-title>{{ headerTitle }}</ion-title>
          <ion-buttons slot="end"><ion-button (click)="confirmPicker()">設定</ion-button></ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding" scrollY="false">
        <ion-picker>
          <ion-grid class="ion-no-padding">
            <ion-row class="ion-no-padding">
              <ion-col [size]="sizeCol0" class="ion-no-padding">
                <ion-picker-column [value]="selectedValueCol0" (ionChange)="onPickerCol0Change($event)">
                  @for (option of optionsCol0; track $index) {
                    <ion-picker-column-option [value]="option.value">{{ option.text }}</ion-picker-column-option>
                  }
                </ion-picker-column>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-picker>
      </ion-content>
    </ng-template>
  </ion-modal>
}
